services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: loganalyzer
      POSTGRES_USER: loganalyzer
      POSTGRES_PASSWORD: loganalyzer
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loganalyzer -d loganalyzer"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./backend/data:/app/data
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://loganalyzer:loganalyzer@db:5432/loganalyzer
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      CORS_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      # Watcher polling: adaptive catch-up loop.
      # WATCHER_INTERVAL_SECONDS is only used when the previous tick was idle;
      # after a productive tick the next one fires after WATCHER_CATCHUP_MIN_SLEEP_SECONDS.
      WATCHER_INTERVAL_SECONDS: ${WATCHER_INTERVAL_SECONDS:-0.5}
      WATCHER_CATCHUP_MIN_SLEEP_SECONDS: ${WATCHER_CATCHUP_MIN_SLEEP_SECONDS:-0.02}
      RULE_SCHEDULER_INTERVAL_SECONDS: 30
      ELASTIC_ENABLED: ${ELASTIC_ENABLED:-false}
      ELASTIC_URL: ${ELASTIC_URL:-http://elastic:9200}
      ELASTIC_INDEXER_ENABLED: ${ELASTIC_INDEXER_ENABLED:-false}
      ELASTIC_INDEXER_INTERVAL_SECONDS: ${ELASTIC_INDEXER_INTERVAL_SECONDS:-5}
      ELASTIC_INDEXER_BATCH_SIZE: ${ELASTIC_INDEXER_BATCH_SIZE:-500}
      # SOC Analyst – continuous AI threat monitoring
      SOC_ANALYST_ENABLED: ${SOC_ANALYST_ENABLED:-true}
      SOC_ANALYST_MODEL: ${SOC_ANALYST_MODEL:-llama3}
      SOC_ANALYST_INTERVAL_SECONDS: ${SOC_ANALYST_INTERVAL_SECONDS:-20}
      SOC_ANALYST_CONFIDENCE_THRESHOLD: ${SOC_ANALYST_CONFIDENCE_THRESHOLD:-0.3}
      SOC_ANALYST_WINDOW_EVENTS: ${SOC_ANALYST_WINDOW_EVENTS:-100}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    command: ["bash", "-lc", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"

  elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    restart: unless-stopped
    profiles: ["elastic"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
  esdata:
