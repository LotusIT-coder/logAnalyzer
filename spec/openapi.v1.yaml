openapi: 3.1.0
info:
  title: Log Analyzer API
  version: 1.0.0
  summary: API for local-first log ingestion, analysis, incidents, and Ollama-powered insights.
  description: |
    This API is designed for a local backend that can be securely exposed over DuckDNS.
    It supports ingestion sources, parsed events, incident workflows, dashboard metrics,
    and AI analysis through Ollama with selectable model profiles.
servers:
  - url: https://your-subdomain.duckdns.org
    description: Public HTTPS endpoint behind reverse proxy
  - url: http://localhost:8080
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: System
  - name: Sources
  - name: Ingestion
  - name: Network
  - name: Parser
  - name: Events
  - name: Rules
  - name: Incidents
  - name: AI
  - name: Metrics
  - name: Auth
  - name: Audit
paths:
  /api/v1/health:
    get:
      tags: [System]
      summary: Liveness and readiness check
      security: []
      responses:
        "200":
          description: Service status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
                  uptime_seconds:
                    type: integer
                  timestamp:
                    type: string
                    format: date-time
                required: [status, uptime_seconds, timestamp]

  /api/v1/version:
    get:
      tags: [System]
      summary: API and build metadata
      security: []
      responses:
        "200":
          description: Version information
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_version:
                    type: string
                  app_version:
                    type: string
                  build_commit:
                    type: string
                required: [api_version, app_version]

  /api/v1/sources:
    get:
      tags: [Sources]
      summary: List configured log sources
      responses:
        "200":
          description: Source list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Source'
                required: [items]
    post:
      tags: [Sources]
      summary: Create a source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceCreateRequest'
      responses:
        "201":
          description: Created source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'

  /api/v1/sources/{id}:
    patch:
      tags: [Sources]
      summary: Update source
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourcePatchRequest'
      responses:
        "200":
          description: Updated source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'

  /api/v1/sources/{id}/test:
    post:
      tags: [Sources]
      summary: Test source connectivity and parser compatibility
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  details:
                    type: string
                required: [ok]

  /api/v1/ingestion/run:
    post:
      tags: [Ingestion]
      summary: Trigger manual ingestion run
      responses:
        "202":
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncJobAccepted'

  /api/v1/parser/test:
    post:
      tags: [Parser]
      summary: Test parser profile against sample lines
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parser_profile_id:
                  type: string
                  format: uuid
                sample_lines:
                  type: array
                  items:
                    type: string
                  minItems: 1
              required: [sample_lines]
      responses:
        "200":
          description: Parsing preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  matched:
                    type: integer
                  total:
                    type: integer
                  preview_events:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
                required: [matched, total, preview_events]

  /api/v1/events:
    get:
      tags: [Events]
      summary: Query events
      parameters:
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
        - name: source_id
          in: query
          schema:
            type: string
            format: uuid
        - name: source_ids
          in: query
          schema:
            type: string
          description: Comma-separated source UUIDs.
        - name: source_paths
          in: query
          schema:
            type: string
          description: Comma-separated source paths resolved to source IDs.
        - name: severity
          in: query
          schema:
            type: string
        - name: service
          in: query
          schema:
            type: string
        - name: host
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: cursor
          in: query
          schema:
            type: string
        - name: provider
          in: query
          schema:
            type: string
            enum: [auto, postgres, elastic]
          description: Select event search provider. auto prefers elastic and falls back to postgres.
      responses:
        "200":
          description: Paged event results
          headers:
            X-Events-Provider:
              description: Provider used for this response.
              schema:
                type: string
                enum: [postgres, elastic, none]
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
                  next_cursor:
                    type: string
                    nullable: true
                required: [items]
        "503":
          description: Requested provider unavailable (for example provider=elastic while elastic is disabled/unreachable)

  /api/v1/events/{id}:
    get:
      tags: [Events]
      summary: Get event details
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        "200":
          description: Event details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'

  /api/v1/events/stream:
    get:
      tags: [Events]
      summary: Stream near real-time events (SSE)
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema:
                type: string

  /api/v1/rules:
    get:
      tags: [Rules]
      summary: List detection rules
      responses:
        "200":
          description: Rule list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Rule'
                required: [items]
    post:
      tags: [Rules]
      summary: Create detection rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleCreateRequest'
      responses:
        "201":
          description: Created rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'

  /api/v1/rules/{id}:
    patch:
      tags: [Rules]
      summary: Update detection rule
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RulePatchRequest'
      responses:
        "200":
          description: Updated rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'

  /api/v1/rules/{id}/dry-run:
    post:
      tags: [Rules]
      summary: Dry-run rule against historical events
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                  format: date-time
                to:
                  type: string
                  format: date-time
      responses:
        "200":
          description: Dry-run result
          content:
            application/json:
              schema:
                type: object
                properties:
                  matched_events:
                    type: integer
                  would_create_incident:
                    type: boolean
                required: [matched_events, would_create_incident]

  /api/v1/incidents:
    get:
      tags: [Incidents]
      summary: List incidents
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, investigating, resolved, false_positive]
        - name: severity
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Incident list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Incident'
                required: [items]

  /api/v1/incidents/{id}:
    get:
      tags: [Incidents]
      summary: Get incident details
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        "200":
          description: Incident details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
    patch:
      tags: [Incidents]
      summary: Update incident state
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentPatchRequest'
      responses:
        "200":
          description: Updated incident
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'

  /api/v1/ai/models:
    get:
      tags: [AI]
      summary: List models available in local Ollama
      responses:
        "200":
          description: Ollama model list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AIModel'
                required: [items]

  /api/v1/ai/analyze/window:
    post:
      tags: [AI]
      summary: Analyze a time window of events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                  format: date-time
                to:
                  type: string
                  format: date-time
                model_profile_id:
                  type: string
                  format: uuid
                max_events:
                  type: integer
                  minimum: 1
                  maximum: 5000
                  default: 500
              required: [from, to]
      responses:
        "202":
          description: Analysis queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncJobAccepted'

  /api/v1/ai/analyze/incident/{id}:
    post:
      tags: [AI]
      summary: Analyze one incident
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                model_profile_id:
                  type: string
                  format: uuid
      responses:
        "202":
          description: Analysis queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncJobAccepted'

  /api/v1/ai/chat:
    post:
      tags: [AI]
      summary: Ask a contextual question about selected logs/incidents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                model_profile_id:
                  type: string
                  format: uuid
                context:
                  type: object
                  properties:
                    incident_id:
                      type: string
                      format: uuid
                    event_ids:
                      type: array
                      items:
                        type: string
                        format: uuid
              required: [message]
      responses:
        "200":
          description: AI response
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer:
                    type: string
                  references:
                    type: array
                    items:
                      type: string
                required: [answer]

  /api/v1/ai/jobs/{id}:
    get:
      tags: [AI]
      summary: Get async AI job status and result
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        "200":
          description: AI job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIJob'

  /api/v1/metrics/timeseries:
    get:
      tags: [Metrics]
      summary: Event count time buckets
      parameters:
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
        - name: bucket
          in: query
          schema:
            type: string
            enum: [1m, 5m, 15m, 1h]
            default: 5m
      responses:
        "200":
          description: Time buckets
          content:
            application/json:
              schema:
                type: object
                properties:
                  points:
                    type: array
                    items:
                      type: object
                      properties:
                        ts:
                          type: string
                          format: date-time
                        count:
                          type: integer
                      required: [ts, count]
                required: [points]

  /api/v1/metrics/top-errors:
    get:
      tags: [Metrics]
      summary: Top recurring errors in time range
      parameters:
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
      responses:
        "200":
          description: Top errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        count:
                          type: integer
                      required: [key, count]
                required: [items]

  /api/v1/metrics/top-services:
    get:
      tags: [Metrics]
      summary: Top services by event volume
      parameters:
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
      responses:
        "200":
          description: Top services
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        service:
                          type: string
                        count:
                          type: integer
                      required: [service, count]
                required: [items]

  /api/v1/metrics/error-rate:
    get:
      tags: [Metrics]
      summary: Error rate over time range
      parameters:
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
      responses:
        "200":
          description: Error rate
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_events:
                    type: integer
                  error_events:
                    type: integer
                  error_rate:
                    type: number
                    format: float
                required: [total_events, error_events, error_rate]

  /api/v1/metrics/network/map:
    get:
      tags: [Metrics]
      summary: Aggregated network communication graph
      parameters:
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
        - name: source_ids
          in: query
          schema:
            type: string
          description: Comma-separated source IDs to include
        - name: source_paths
          in: query
          schema:
            type: string
          description: Comma-separated source paths to include
      responses:
        "200":
          description: Network topology graph
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        label:
                          type: string
                        kind:
                          type: string
                        total_bytes:
                          type: integer
                        total_connections:
                          type: integer
                        risk_score:
                          type: number
                          format: float
                      required: [id, label, kind, total_bytes, total_connections, risk_score]
                  edges:
                    type: array
                    items:
                      type: object
                      properties:
                        source:
                          type: string
                        target:
                          type: string
                        app:
                          type: string
                          nullable: true
                        protocol:
                          type: string
                          nullable: true
                        dst_port:
                          type: integer
                          nullable: true
                        bytes:
                          type: integer
                        connections:
                          type: integer
                        allowed_count:
                          type: integer
                        blocked_count:
                          type: integer
                        anomaly_score:
                          type: number
                          format: float
                      required: [source, target, bytes, connections, allowed_count, blocked_count, anomaly_score]
                required: [nodes, edges]

  /api/v1/network/flows:
    get:
      tags: [Metrics]
      summary: List normalized network flows
      parameters:
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: source_ids
          in: query
          schema:
            type: string
        - name: source_paths
          in: query
          schema:
            type: string
        - name: src_ip
          in: query
          schema:
            type: string
        - name: dst_ip
          in: query
          schema:
            type: string
        - name: protocol
          in: query
          schema:
            type: string
        - name: dst_port
          in: query
          schema:
            type: integer
        - name: app_hint
          in: query
          schema:
            type: string
        - name: process_name
          in: query
          schema:
            type: string
        - name: direction
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: telemetry_type
          in: query
          schema:
            type: string
            enum: [netflow, ipfix, sflow, socket_observer]
      responses:
        "200":
          description: Paged network flow list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkFlowListResponse'

  /api/v1/network/flows/{id}:
    get:
      tags: [Metrics]
      summary: Get normalized network flow details
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        "200":
          description: Flow details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkFlow'

  /api/v1/network/flows/summary:
    get:
      tags: [Metrics]
      summary: Summary KPIs for network traffic
      parameters:
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
        - name: source_ids
          in: query
          schema:
            type: string
        - name: source_paths
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Network summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkFlowSummary'

  /api/v1/network/flows/map:
    get:
      tags: [Metrics]
      summary: Aggregated network topology graph from normalized flows
      parameters:
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
        - name: source_ids
          in: query
          schema:
            type: string
        - name: source_paths
          in: query
          schema:
            type: string
        - name: group_by
          in: query
          schema:
            type: string
            enum: [host, process, app, ip]
            default: host
      responses:
        "200":
          description: Network topology graph
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkMapResponse'

  /api/v1/network/interfaces:
    get:
      tags: [Metrics]
      summary: List latest interface measurements
      parameters:
        - name: host_id
          in: query
          schema:
            type: string
        - name: interface_name
          in: query
          schema:
            type: string
        - name: source_ids
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Interface measurements
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/InterfaceSampleView'
                required: [items]

  /api/v1/network/interfaces/timeseries:
    get:
      tags: [Metrics]
      summary: Interface counters over time
      parameters:
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
        - name: bucket
          in: query
          schema:
            type: string
            enum: [1m, 5m, 15m, 1h]
            default: 5m
        - name: host_id
          in: query
          schema:
            type: string
        - name: interface_name
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Interface timeseries
          content:
            application/json:
              schema:
                type: object
                properties:
                  points:
                    type: array
                    items:
                      $ref: '#/components/schemas/InterfaceSampleView'
                required: [points]

  /api/v1/network/sockets:
    get:
      tags: [Metrics]
      summary: List observed host sockets and process connections
      parameters:
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
        - name: host_id
          in: query
          schema:
            type: string
        - name: pid
          in: query
          schema:
            type: integer
        - name: process_name
          in: query
          schema:
            type: string
        - name: remote_ip
          in: query
          schema:
            type: string
        - name: protocol
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Socket sample list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SocketSample'
                required: [items]

  /api/v1/network/exporters:
    get:
      tags: [Metrics]
      summary: List NetFlow, IPFIX, and sFlow exporter health states
      responses:
        "200":
          description: Exporter health list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/NetworkExporterState'
                required: [items]

  /api/v1/network/capture/jobs:
    get:
      tags: [Metrics]
      summary: List packet capture jobs
      responses:
        "200":
          description: Capture job list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CaptureJob'
                required: [items]
    post:
      tags: [Metrics]
      summary: Create packet capture job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptureJobCreateRequest'
      responses:
        "202":
          description: Capture job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureJob'

  /api/v1/network/capture/jobs/{id}:
    get:
      tags: [Metrics]
      summary: Get packet capture job details
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        "200":
          description: Capture job details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureJob'

  /api/v1/network/capture/jobs/{id}/stop:
    post:
      tags: [Metrics]
      summary: Stop a running packet capture job
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        "202":
          description: Capture stop accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureJob'

  /api/v1/network/capture/artifacts/{id}:
    get:
      tags: [Metrics]
      summary: Get packet capture artifact metadata
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        "200":
          description: Capture artifact metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureArtifact'

  /api/v1/network/capture/artifacts/{id}/download:
    get:
      tags: [Metrics]
      summary: Download packet capture artifact
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        "200":
          description: Binary capture artifact stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /api/v1/network/ingest/flows:
    post:
      tags: [Network]
      summary: Ingest normalized flow batches from collectors or host agents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkFlowIngestBatch'
      responses:
        "200":
          description: Batch accepted or recognized as duplicate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkFlowIngestResponse'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Exchange user credentials for an API token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required: [email, password]
      responses:
        "200":
          description: Access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  token_id:
                    type: string
                    format: uuid
                required: [token, token_id]

  /api/v1/auth/token:
    post:
      tags: [Auth]
      summary: Create API token with scoped permissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                role:
                  type: string
                  enum: [viewer, analyst, operator, admin]
                  default: viewer
                user_id:
                  type: string
                  format: uuid
                  nullable: true
                scopes:
                  type: array
                  items:
                    type: string
                expires_at:
                  type: string
                  format: date-time
              required: [name]
      responses:
        "201":
          description: Created token (shown once)
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  token_id:
                    type: string
                    format: uuid
                required: [token, token_id]

  /api/v1/auth/tokens:
    get:
      tags: [Auth]
      summary: List issued API tokens (admin)
      responses:
        "200":
          description: Token list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        user_id:
                          type: string
                          format: uuid
                          nullable: true
                        role:
                          type: string
                          enum: [viewer, analyst, operator, admin]
                        scopes:
                          type: array
                          items:
                            type: string
                        expires_at:
                          type: string
                          format: date-time
                          nullable: true
                        last_used_at:
                          type: string
                          format: date-time
                          nullable: true
                        created_at:
                          type: string
                          format: date-time
                        revoked_at:
                          type: string
                          format: date-time
                          nullable: true
                      required: [id, name, role, scopes, created_at]
                required: [items]

  /api/v1/auth/tokens/{id}/revoke:
    post:
      tags: [Auth]
      summary: Revoke API token (admin)
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        "200":
          description: Revoked token
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  user_id:
                    type: string
                    format: uuid
                    nullable: true
                  role:
                    type: string
                    enum: [viewer, analyst, operator, admin]
                  scopes:
                    type: array
                    items:
                      type: string
                  expires_at:
                    type: string
                    format: date-time
                    nullable: true
                  last_used_at:
                    type: string
                    format: date-time
                    nullable: true
                  created_at:
                    type: string
                    format: date-time
                  revoked_at:
                    type: string
                    format: date-time
                    nullable: true
                required: [id, name, role, scopes, created_at]

  /api/v1/auth/users:
    get:
      tags: [Auth]
      summary: List users (admin)
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        email:
                          type: string
                        role:
                          type: string
                            password:
                              type: string
                          enum: [viewer, analyst, operator, admin]
                        enabled:
                          type: boolean
                        created_at:
                          type: string
                          format: date-time
                          required: [name, email, password]
                          type: string
                          format: date-time
                      required: [id, name, email, role, enabled, created_at, updated_at]
                required: [items]
    post:
      tags: [Auth]
      summary: Create user (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                role:
                  type: string
                  enum: [viewer, analyst, operator, admin]
                  default: viewer
                enabled:
                  type: boolean
                  default: true
              required: [name, email]
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  email:
                    type: string
                  role:
                    type: string
                    enum: [viewer, analyst, operator, admin]
                  enabled:
                    type: boolean
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
                required: [id, name, email, role, enabled, created_at, updated_at]

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Current principal and scopes
      responses:
        "200":
          description: Current identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  subject:
                    type: string
                  user_id:
                    type: string
                    format: uuid
                    nullable: true
                  role:
                    type: string
                    enum: [viewer, analyst, operator, admin]
                  scopes:
                    type: array
                    items:
                      type: string
                required: [subject, role, scopes]

  /api/v1/audit:
    get:
      tags: [Audit]
      summary: List audit events (admin)
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Audit list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLog'
                required: [items]

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FromParam:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
    ToParam:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time

  schemas:
    Source:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [file, syslog, journald, docker, netflow, sflow, socket_observer, packet_capture]
        config:
          type: object
          additionalProperties: true
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, name, type, config, enabled, created_at, updated_at]

    SourceCreateRequest:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [file, syslog, journald, docker, netflow, sflow, socket_observer, packet_capture]
        config:
          type: object
          additionalProperties: true
        enabled:
          type: boolean
          default: true
      required: [name, type, config]

    SourcePatchRequest:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [file, syslog, journald, docker, netflow, sflow, socket_observer, packet_capture]
        config:
          type: object
          additionalProperties: true
        enabled:
          type: boolean

    NetworkFlow:
      type: object
      properties:
        id:
          type: string
          format: uuid
        source_id:
          type: string
          format: uuid
        telemetry_type:
          type: string
          enum: [netflow, ipfix, sflow, socket_observer]
        observed_at_start:
          type: string
          format: date-time
        observed_at_end:
          type: string
          format: date-time
        host_id:
          type: string
          nullable: true
        exporter_addr:
          type: string
          nullable: true
        src_ip:
          type: string
        dst_ip:
          type: string
        src_port:
          type: integer
          nullable: true
        dst_port:
          type: integer
          nullable: true
        protocol:
          type: string
        bytes:
          type: integer
        packets:
          type: integer
        connections:
          type: integer
        direction:
          type: string
          nullable: true
        app_hint:
          type: string
          nullable: true
        process_name:
          type: string
          nullable: true
        action:
          type: string
          nullable: true
        sample_factor:
          type: number
          format: float
        confidence:
          type: number
          format: float
        created_at:
          type: string
          format: date-time
      required: [id, source_id, telemetry_type, observed_at_start, observed_at_end, src_ip, dst_ip, protocol, bytes, packets, connections, sample_factor, confidence, created_at]

    NetworkFlowListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NetworkFlow'
        next_cursor:
          type: string
          nullable: true
      required: [items]

    NetworkFlowSummary:
      type: object
      properties:
        total_flows:
          type: integer
        total_bytes:
          type: integer
        total_packets:
          type: integer
        total_connections:
          type: integer
        unique_sources:
          type: integer
        unique_destinations:
          type: integer
        blocked_flows:
          type: integer
        sampled_flows:
          type: integer
        new_destination_count:
          type: integer
      required: [total_flows, total_bytes, total_packets, total_connections, unique_sources, unique_destinations, blocked_flows, sampled_flows, new_destination_count]

    NetworkFlowIngestItem:
      type: object
      properties:
        item_id:
          type: string
          format: uuid
        observed_at_start:
          type: string
          format: date-time
        observed_at_end:
          type: string
          format: date-time
        host_id:
          type: string
          nullable: true
        exporter_addr:
          type: string
          nullable: true
        observation_domain_id:
          type: integer
          nullable: true
        src_ip:
          type: string
        dst_ip:
          type: string
        src_port:
          type: integer
          nullable: true
        dst_port:
          type: integer
          nullable: true
        protocol:
          type: string
        bytes:
          type: integer
          minimum: 0
        packets:
          type: integer
          minimum: 0
        connections:
          type: integer
          minimum: 0
        direction:
          type: string
          nullable: true
        action:
          type: string
          nullable: true
        app_hint:
          type: string
          nullable: true
        process_name:
          type: string
          nullable: true
        sample_factor:
          type: number
          format: float
          minimum: 0
        confidence:
          type: number
          format: float
          minimum: 0
      required:
        - item_id
        - observed_at_start
        - observed_at_end
        - src_ip
        - dst_ip
        - protocol
        - bytes
        - packets
        - connections
        - sample_factor
        - confidence

    NetworkFlowIngestBatch:
      type: object
      properties:
        batch_id:
          type: string
          format: uuid
        collector_node_id:
          type: string
        source_id:
          type: string
          format: uuid
        telemetry_type:
          type: string
          enum: [netflow, ipfix, sflow, socket_observer]
        schema_version:
          type: integer
          enum: [1]
        created_at:
          type: string
          format: date-time
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/NetworkFlowIngestItem'
      required: [batch_id, collector_node_id, source_id, telemetry_type, schema_version, created_at, items]

    NetworkFlowIngestResponse:
      type: object
      properties:
        batch_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [accepted, duplicate, rejected]
        accepted_count:
          type: integer
          minimum: 0
        rejected_count:
          type: integer
          minimum: 0
        duplicate:
          type: boolean
        errors:
          type: array
          items:
            type: string
      required: [batch_id, status, accepted_count, rejected_count, duplicate, errors]

    NetworkMapNode:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        kind:
          type: string
          enum: [host, process, app, subnet, external]
        total_bytes:
          type: integer
        total_connections:
          type: integer
        risk_score:
          type: number
          format: float
      required: [id, label, kind, total_bytes, total_connections, risk_score]

    NetworkMapEdge:
      type: object
      properties:
        source:
          type: string
        target:
          type: string
        app_hint:
          type: string
          nullable: true
        protocol:
          type: string
          nullable: true
        dst_port:
          type: integer
          nullable: true
        bytes:
          type: integer
        packets:
          type: integer
        connections:
          type: integer
        blocked_count:
          type: integer
        anomaly_score:
          type: number
          format: float
      required: [source, target, bytes, packets, connections, blocked_count, anomaly_score]

    NetworkMapResponse:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/NetworkMapNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/NetworkMapEdge'
      required: [nodes, edges]

    InterfaceSampleView:
      type: object
      properties:
        host_id:
          type: string
        interface_name:
          type: string
        ts:
          type: string
          format: date-time
        rx_bytes:
          type: integer
        tx_bytes:
          type: integer
        rx_drops:
          type: integer
        tx_drops:
          type: integer
        rx_errors:
          type: integer
        tx_errors:
          type: integer
        oper_state:
          type: string
      required: [host_id, interface_name, ts, rx_bytes, tx_bytes, rx_drops, tx_drops, rx_errors, tx_errors, oper_state]

    SocketSample:
      type: object
      properties:
        id:
          type: string
          format: uuid
        host_id:
          type: string
        ts:
          type: string
          format: date-time
        pid:
          type: integer
          nullable: true
        process_name:
          type: string
          nullable: true
        executable:
          type: string
          nullable: true
        local_ip:
          type: string
        local_port:
          type: integer
          nullable: true
        remote_ip:
          type: string
        remote_port:
          type: integer
          nullable: true
        protocol:
          type: string
        state:
          type: string
        bytes_in:
          type: integer
          nullable: true
        bytes_out:
          type: integer
          nullable: true
      required: [id, host_id, ts, local_ip, remote_ip, protocol, state]

    NetworkExporterState:
      type: object
      properties:
        source_id:
          type: string
          format: uuid
        collector_node_id:
          type: string
        telemetry_type:
          type: string
          enum: [netflow, ipfix, sflow]
        exporter_addr:
          type: string
        observation_domain_id:
          type: integer
          nullable: true
        last_seen_at:
          type: string
          format: date-time
        status:
          type: string
        template_ok:
          type: boolean
        sequence_gap_count:
          type: integer
        decode_error_count:
          type: integer
        sample_factor:
          type: number
          format: float
          nullable: true
      required: [source_id, collector_node_id, telemetry_type, exporter_addr, last_seen_at, status, template_ok, sequence_gap_count, decode_error_count]

    CaptureJobCreateRequest:
      type: object
      properties:
        source_id:
          type: string
          format: uuid
        target_host:
          type: string
        interface_name:
          type: string
        bpf_filter:
          type: string
        snaplen:
          type: integer
          minimum: 64
          maximum: 65535
        duration_seconds:
          type: integer
          minimum: 1
        retention_hours:
          type: integer
          minimum: 1
        reason:
          type: string
      required: [source_id, target_host, interface_name, bpf_filter, snaplen, duration_seconds, retention_hours, reason]

    CaptureJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        source_id:
          type: string
          format: uuid
        target_host:
          type: string
        interface_name:
          type: string
        bpf_filter:
          type: string
        snaplen:
          type: integer
        duration_seconds:
          type: integer
        status:
          type: string
          enum: [pending, running, stopping, completed, failed, expired]
        retention_until:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        ended_at:
          type: string
          format: date-time
          nullable: true
      required: [id, source_id, target_host, interface_name, bpf_filter, snaplen, duration_seconds, status, retention_until]

    CaptureArtifact:
      type: object
      properties:
        id:
          type: string
          format: uuid
        job_id:
          type: string
          format: uuid
        storage_backend:
          type: string
        object_path:
          type: string
        sha256:
          type: string
        packet_count:
          type: integer
        byte_size:
          type: integer
        encrypted:
          type: boolean
        created_at:
          type: string
          format: date-time
      required: [id, job_id, storage_backend, object_path, sha256, packet_count, byte_size, encrypted, created_at]

    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
        source_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        severity:
          type: string
        service:
          type: string
          nullable: true
        host:
          type: string
          nullable: true
        environment:
          type: string
          nullable: true
        event_type:
          type: string
          nullable: true
        message:
          type: string
        fields:
          type: object
          additionalProperties: true
        fingerprint:
          type: string
          nullable: true
      required: [id, source_id, timestamp, severity, message, fields]

    Rule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        condition:
          type: object
          additionalProperties: true
        threshold:
          type: integer
          minimum: 1
        window_seconds:
          type: integer
          minimum: 1
        severity:
          type: string
        enabled:
          type: boolean
      required: [id, name, condition, threshold, window_seconds, severity, enabled]

    RuleCreateRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        condition:
          type: object
          additionalProperties: true
        threshold:
          type: integer
          minimum: 1
        window_seconds:
          type: integer
          minimum: 1
        severity:
          type: string
        enabled:
          type: boolean
          default: true
      required: [name, condition, threshold, window_seconds, severity]

    RulePatchRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        condition:
          type: object
          additionalProperties: true
        threshold:
          type: integer
          minimum: 1
        window_seconds:
          type: integer
          minimum: 1
        severity:
          type: string
        enabled:
          type: boolean

    Incident:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          enum: [open, investigating, resolved, false_positive]
        severity:
          type: string
        first_seen:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
        event_count:
          type: integer
        rule_id:
          type: string
          format: uuid
          nullable: true
        summary:
          type: string
          nullable: true
        assignee:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
      required: [id, title, status, severity, first_seen, last_seen, event_count, tags]

    IncidentPatchRequest:
      type: object
      properties:
        status:
          type: string
          enum: [open, investigating, resolved, false_positive]
        summary:
          type: string
        assignee:
          type: string
        tags:
          type: array
          items:
            type: string

    AIModel:
      type: object
      properties:
        name:
          type: string
        size:
          type: string
          nullable: true
        family:
          type: string
          nullable: true
        modified_at:
          type: string
          format: date-time
          nullable: true
      required: [name]

    AIJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, completed, failed]
        result:
          type: object
          additionalProperties: true
          nullable: true
        error:
          type: string
          nullable: true
      required: [id, status]

    AsyncJobAccepted:
      type: object
      properties:
        job_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued]
      required: [job_id, status]

    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        actor:
          type: string
        action:
          type: string
        resource:
          type: string
        status:
          type: string
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
      required: [id, actor, action, resource, status, created_at]
